name: bukken-pipeline daily

# 毎朝、物件候補の再採点を自動実行する（M5）。
#
# 注意（重要）: このワークフローはリポジトリに出力をコミットしない。
# data/output.xlsx はワークフロー実行の Artifact としてのみ保存する
# （Actions Artifactはリポジトリの可視性に関わらず、リポジトリへの読み取り
#  権限を持つ人にしか見えない。一方コミットするとリポジトリを見られる全員に
#  公開されてしまう。個人の住宅購入検討データを公開GitHub Pagesサイトの
#  リポジトリ直下に置く構成のため、この境界は意図的に厳守すること）。
#
# 必要なリポジトリシークレット（Settings > Secrets and variables > Actions）:
#   REINFOLIB_API_KEY               不動産情報ライブラリAPIキー
#   GOOGLE_MAPS_API_KEY              Google Maps Routes APIキー（旧Directions APIではない）
#   GMAIL_OAUTH_CLIENT_SECRET_JSON    GCPでダウンロードしたOAuthクライアントjsonの中身
#   GMAIL_TOKEN_JSON                   ローカルで一度 python run.py --gmail を実行し
#                                         認可した後にできる secrets/gmail_token.json の中身
#                                         （CI環境ではブラウザ認可フローを開けないため、
#                                          事前にローカルで生成したものを貼り付ける）
#   GOOGLE_SHEETS_SPREADSHEET_ID        出力先スプレッドシートID（任意。空なら毎回新規作成）
#   NOTIFY_EMAIL_TO                      通知先メールアドレス（任意）
#   GMAIL_LABEL                           保存検索メールのGmailラベル名（任意、既定"bukken"）
#
# シークレットが1つでも未設定でも、該当ステージはseed値へフォールバックして
# パイプライン全体は止まらない（run.py側の設計）。

on:
  schedule:
    - cron: "30 21 * * *"  # 21:30 UTC = 翌6:30 JST（毎朝）
  workflow_dispatch: {}

jobs:
  score:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bukken-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: bukken-pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write secrets to local files (not committed)
        run: |
          mkdir -p secrets
          printf '%s' "$GMAIL_OAUTH_CLIENT_SECRET_JSON" > secrets/gmail_client_secret.json
          printf '%s' "$GMAIL_TOKEN_JSON" > secrets/gmail_token.json
          cat > .env <<EOF
          REINFOLIB_API_KEY=${REINFOLIB_API_KEY}
          GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
          GMAIL_OAUTH_CLIENT_SECRET_PATH=./secrets/gmail_client_secret.json
          GMAIL_TOKEN_PATH=./secrets/gmail_token.json
          GMAIL_LABEL=${GMAIL_LABEL:-bukken}
          GOOGLE_SHEETS_SPREADSHEET_ID=${GOOGLE_SHEETS_SPREADSHEET_ID}
          NOTIFY_EMAIL_TO=${NOTIFY_EMAIL_TO}
          EOF
        env:
          REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GMAIL_OAUTH_CLIENT_SECRET_JSON: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_LABEL: ${{ secrets.GMAIL_LABEL }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}

      - name: Run pipeline
        run: python run.py --all

      - name: Upload output as artifact (private, not published)
        uses: actions/upload-artifact@v4
        with:
          name: bukken-output-${{ github.run_id }}
          path: bukken-pipeline/data/output.xlsx
          retention-days: 30
